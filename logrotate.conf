# Traefik access log rotation for secure-zellij (docs/log-rotation.md)
#
# Install with `just logrotate-install`, which replaces LOG_PATH with the
# volume's mount point:
#   podman volume inspect secure-zellij_traefik-logs --format '{{.Mountpoint}}'
#
# copytruncate instead of a USR1 to Traefik: logrotate runs as root, and root's
# podman can't see the rootless secure-zellij-traefik container, so the signal
# would never arrive and Traefik would keep writing to the rotated file.
# Traefik opens the log with O_APPEND, so after the truncate it carries on at
# the start of the empty file. fail2ban and the alerter both notice the
# truncation and keep reading. Lines written between the copy and the truncate
# are lost.
LOG_PATH/access.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
