[project]
name = "zellij-alerter"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.165",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-mock>=3.15",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
