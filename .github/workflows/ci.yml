name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile sso config --quiet

      - name: Shellcheck
        run: shellcheck -x traefik/entrypoint.sh tests/lib.sh tests/sso-e2e.sh tests/unban-e2e.sh tests/fail2ban-filter.sh tests/ban-e2e.sh tests/bench.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"

      - name: Set up Python
        run: uv python install 3.15.2

      - name: Install dependencies
        working-directory: alerter
        run: uv sync --frozen

      - name: Lint alerter (ruff check)
        working-directory: alerter
        run: uv run ruff check . ../fail2ban

      - name: Format check alerter (ruff format)
        working-directory: alerter
        run: uv run ruff format --check . ../fail2ban

      - name: Test alerter (pytest)
        working-directory: alerter
        run: uv run pytest

      - name: Check for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sso-e2e:
    name: SSO end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run SSO e2e (mock IdP, podman)
        env:
          COMPOSE: docker compose
        run: |
          podman --version
          tests/sso-e2e.sh

  unban-e2e:
    name: Unban end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the fail2ban filter against sample log lines
        env:
          COMPOSE: docker compose
        run: tests/fail2ban-filter.sh

      - name: Install pasta (rootless networking for the edge namespace)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq passt

      - name: Check that bans really block (real Traefik + fail2ban, nftables)
        env:
          COMPOSE: docker compose
        run: tests/ban-e2e.sh

      - name: Run unban e2e (real fail2ban, podman)
        env:
          COMPOSE: docker compose
        run: |
          podman --version
          tests/unban-e2e.sh
