name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile sso config --quiet

      - name: Shellcheck
        run: shellcheck traefik/entrypoint.sh tests/sso-e2e.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"

      - name: Set up Python
        run: uv python install 3.15.2

      - name: Install dependencies
        working-directory: alerter
        run: uv sync --frozen

      - name: Lint alerter (ruff check)
        working-directory: alerter
        run: uv run ruff check .

      - name: Format check alerter (ruff format)
        working-directory: alerter
        run: uv run ruff format --check .

      - name: Test alerter (pytest)
        working-directory: alerter
        run: uv run pytest

      - name: Check for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sso-e2e:
    name: SSO end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run SSO e2e (mock IdP, podman)
        env:
          COMPOSE: docker compose
        run: |
          podman --version
          tests/sso-e2e.sh
