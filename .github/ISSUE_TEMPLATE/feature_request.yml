name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the stack makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mention anything that affects security, rootless operation or SELinux.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
