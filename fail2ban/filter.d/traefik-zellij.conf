# Bans clients that collect 4xx responses in Traefik's JSON access log.
#
# Kept cheap on purpose: each log line is ~2 KB and fail2ban runs the regex on
# every one. No leading ".*" (that made Python retry the match from every
# position, ~3 ms per line), a lazy gap between the two fields, and <ADDR>
# instead of <HOST> since ClientAddr is always an IP (no DNS handling needed).
# Not anchored to the start of the line, so a new Traefik field sorting before
# ClientAddr can't silently switch bans off.
#
# Spoofing: Traefik escapes quotes inside values (\"), so a client can't put
# a fake "ClientAddr" or "DownstreamStatus" in a header and get it matched.
# tests/fail2ban-filter.sh checks this, IPv6 and the 4xx boundaries.
[Definition]
failregex = "ClientAddr":"<ADDR>:\d+".*?"DownstreamStatus":4\d\d,

ignoreregex =

datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%SZ"
