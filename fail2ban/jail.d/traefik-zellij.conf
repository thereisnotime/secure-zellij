[traefik-zellij]
enabled   = true
filter    = traefik-zellij
logpath   = /var/log/traefik/access.log
maxretry  = 10
findtime  = 60
bantime   = 3600
# Repeat offenders get longer bans: 1h, 2h, 4h, ... up to a week. Works off the
# ban history in fail2ban's database, kept for F2B_DB_PURGE_AGE (7d, compose.yaml).
bantime.increment = true
bantime.factor    = 1
bantime.maxtime   = 604800
# nftables inside the edge container's network namespace (compose.yaml), where
# only Traefik listens, so all ports there are Traefik's
action    = nftables-allports[name=traefik-zellij]
